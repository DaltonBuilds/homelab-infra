---
# Runs only when checks.yaml found no guest. Retire at Tier 1 [1.3]: tag the last commit
# with this file, delete it and its include, and leave a README pointer (HOMELAB-21).
- name: Check that nothing answers on the node address yet
  ansible.builtin.command: /usr/bin/ping -c 2 -W 1 {{ ansible_host }}
  register: vault_vm_address_probe
  changed_when: false
  failed_when: vault_vm_address_probe.rc == 0
  check_mode: false
  delegate_to: "{{ vault_vm_pve_node }}"

- name: Stage the pinned Ubuntu cloud image
  ansible.builtin.get_url:
    url: "{{ vault_vm_image_url }}"
    dest: "{{ vault_vm_image_path }}"
    checksum: sha256:{{ vault_vm_image_sha256 }}
    owner: root
    group: root
    mode: '0644'
  delegate_to: "{{ vault_vm_pve_node }}"

- name: Stage the administrator public key for cloud-init
  ansible.builtin.copy:
    content: "{{ vault_vm_admin_ssh_public_key }}\n"
    dest: /root/homelab-vault.pub
    owner: root
    group: root
    mode: '0600'
  delegate_to: "{{ vault_vm_pve_node }}"

# No password is set, so cloud-init locks the account password and Ubuntu's image
# keeps SSH password authentication off. Network and vendor data come from snippets,
# added once the NIC's MAC is known.
- name: Create the VM from the cloud image
  ansible.builtin.command:
    argv:
      - /usr/sbin/qm
      - create
      - "{{ vault_vm_vmid }}"
      - --name
      - "{{ vault_vm_hostname }}"
      - --description
      - "{{ vault_vm_description }}"
      - --tags
      - openbao
      - --ostype
      - l26
      - --cpu
      - x86-64-v2-AES
      - --cores
      - "{{ vault_vm_cores }}"
      - --memory
      - "{{ vault_vm_memory_mb }}"
      # Fixed memory: no balloon driver reclaiming pages from the secrets process.
      - --balloon
      - "0"
      - --scsihw
      - virtio-scsi-single
      - --scsi0
      - "{{ vault_vm_disk_storage }}:0,import-from={{ vault_vm_image_path }},iothread=1,discard=on"
      - --ide2
      - "{{ vault_vm_disk_storage }}:cloudinit"
      - --boot
      - order=scsi0
      - --serial0
      - socket
      - --vga
      - serial0
      # Untagged on vmbr0: VLAN 40 is native on the host port.
      - --net0
      - "virtio,bridge={{ hostvars[vault_vm_pve_node].pve_baseline_bridge }},firewall=1"
      - --agent
      - enabled=1
      - --onboot
      - "1"
      - --ciuser
      - "{{ vault_vm_admin_user }}"
      - --sshkeys
      - /root/homelab-vault.pub
      # The generated user data takes the FQDN from the search domain.
      - --searchdomain
      - "{{ vault_vm_domain }}"
      - --ciupgrade
      - "0"
  delegate_to: "{{ vault_vm_pve_node }}"

- name: Read the MAC Proxmox assigned to the NIC
  ansible.builtin.command: /usr/sbin/qm config {{ vault_vm_vmid }}
  register: vault_vm_new_config
  changed_when: false
  delegate_to: "{{ vault_vm_pve_node }}"

- name: Note the MAC
  ansible.builtin.set_fact:
    vault_vm_mac: "{{ vault_vm_new_config.stdout | regex_search('(?m)^net0:\\s*virtio=([0-9A-Fa-f:]{17})', '\\1') | first }}"
  when: vault_vm_new_config is not skipped

- name: Create the snippets directory
  ansible.builtin.file:
    path: "{{ vault_vm_snippet_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  delegate_to: "{{ vault_vm_pve_node }}"

- name: Write the cloud-init snippets
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ vault_vm_snippet_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - { src: network.yaml.j2, dest: "{{ vault_vm_network_snippet }}" }
    - { src: vendor.yaml.j2, dest: "{{ vault_vm_vendor_snippet }}" }
  delegate_to: "{{ vault_vm_pve_node }}"
  when: vault_vm_new_config is not skipped

- name: Attach the snippets to the VM
  ansible.builtin.command: >-
    /usr/sbin/qm set {{ vault_vm_vmid }} --cicustom
    network=local:snippets/{{ vault_vm_network_snippet }},vendor=local:snippets/{{ vault_vm_vendor_snippet }}
  delegate_to: "{{ vault_vm_pve_node }}"

- name: Grow the imported disk to its planned size
  ansible.builtin.command: /usr/sbin/qm disk resize {{ vault_vm_vmid }} scsi0 {{ vault_vm_disk_gb }}G
  delegate_to: "{{ vault_vm_pve_node }}"

- name: Start the VM
  ansible.builtin.command: /usr/sbin/qm start {{ vault_vm_vmid }}
  delegate_to: "{{ vault_vm_pve_node }}"

# The agent arrives with vendor data, so it answering means first boot reached the network.
- name: Wait for the guest agent installed on first boot
  ansible.builtin.command: /usr/sbin/qm agent {{ vault_vm_vmid }} ping
  register: vault_vm_first_agent_ping
  changed_when: false
  retries: 60
  delay: 10
  until: vault_vm_first_agent_ping.rc == 0
  delegate_to: "{{ vault_vm_pve_node }}"

- name: Wait for first-boot cloud-init to finish
  ansible.builtin.command: /usr/sbin/qm guest exec {{ vault_vm_vmid }} --timeout 600 -- /usr/bin/cloud-init status --wait --long
  register: vault_vm_first_cloud_init
  changed_when: false
  # qm reports the guest's exit code in JSON; 2 is "done with recoverable errors".
  failed_when: (vault_vm_first_cloud_init.stdout | from_json).exitcode not in [0, 2]
  delegate_to: "{{ vault_vm_pve_node }}"
  when: not ansible_check_mode

- name: Note that this run created the VM
  ansible.builtin.set_fact:
    vault_vm_created: true
