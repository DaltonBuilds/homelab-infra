---
- name: Rebuild GPU initramfs
  ansible.builtin.file:
    path: /etc/initramfs-tools/.homelab-gpu-rebuild-pending
    state: touch
    owner: root
    group: root
    mode: '0600'
  listen: Rebuild GPU boot images
  when: not ansible_check_mode

- name: Regenerate GPU initramfs
  ansible.builtin.command: /usr/sbin/update-initramfs -u -k all
  changed_when: true
  listen: Rebuild GPU boot images
  when: not ansible_check_mode

- name: Clear successful GPU initramfs rebuild marker
  ansible.builtin.file:
    path: /etc/initramfs-tools/.homelab-gpu-rebuild-pending
    state: absent
  listen: Rebuild GPU boot images
  when: not ansible_check_mode
