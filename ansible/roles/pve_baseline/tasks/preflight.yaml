---
- name: Check host identity before changing anything
  ansible.builtin.import_tasks: identity.yaml

- name: Read cluster quorum before changing anything
  ansible.builtin.command: /usr/bin/pvecm status
  register: pve_baseline_preflight_pvecm
  changed_when: false
  check_mode: false

- name: Require a quorate cluster with every expected vote present
  ansible.builtin.assert:
    that:
      - pve_baseline_preflight_pvecm.stdout is search('(?m)^Name:\s+' ~ pve_baseline_cluster_name ~ '\s*$')
      - pve_baseline_preflight_pvecm.stdout is search('(?m)^Quorate:\s+Yes\s*$')
      - pve_baseline_preflight_pvecm.stdout is search('(?m)^Expected votes:\s+' ~ pve_baseline_cluster_expected_votes ~ '\s*$')
      - pve_baseline_preflight_pvecm.stdout is search('(?m)^Total votes:\s+' ~ pve_baseline_cluster_expected_votes ~ '\s*$')
    fail_msg: Cluster is not fully healthy. Restore every member before changing another host.
