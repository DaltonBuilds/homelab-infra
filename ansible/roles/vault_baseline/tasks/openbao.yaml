---
# HOMELAB-27. The package has no apt repository: download the release asset, check it
# against the pinned digest, install it, and hold it so no apt run replaces it.
- name: Read the installed OpenBao version
  ansible.builtin.command: /usr/bin/dpkg-query --showformat=${Version} --show openbao
  register: vault_baseline_openbao_installed
  changed_when: false
  failed_when: false
  check_mode: false

# Check mode downloads nothing, so on a node without the pinned version the remaining
# tasks have no package, unit or selection to inspect. They report only up to here.
- name: Note whether this is a dry run of an install
  ansible.builtin.set_fact:
    vault_baseline_openbao_dry_install: "{{ ansible_check_mode and vault_baseline_openbao_installed.stdout != vault_baseline_openbao_version }}"

- name: Create the package cache directory
  ansible.builtin.file:
    path: "{{ vault_baseline_openbao_package_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download the pinned OpenBao package
  ansible.builtin.get_url:
    url: "{{ vault_baseline_openbao_url }}"
    dest: "{{ vault_baseline_openbao_package_path }}"
    checksum: sha256:{{ vault_baseline_openbao_sha256 }}
    owner: root
    group: root
    mode: '0644'
  when: not vault_baseline_openbao_dry_install | bool

# A held package cannot be replaced, so a new pin releases the hold first.
- name: Release the hold for a version change
  ansible.builtin.dpkg_selections:
    name: openbao
    selection: install
  when:
    - vault_baseline_openbao_installed.rc == 0
    - vault_baseline_openbao_installed.stdout != vault_baseline_openbao_version

# postinst creates the openbao user, a self-signed TLS pair in /opt/openbao/tls and an
# empty /opt/openbao/data. It does not enable or start the service.
- name: Install OpenBao
  ansible.builtin.apt:
    deb: "{{ vault_baseline_openbao_package_path }}"
  when:
    - vault_baseline_openbao_installed.stdout != vault_baseline_openbao_version
    - not vault_baseline_openbao_dry_install | bool

- name: Hold OpenBao at the pinned version
  ansible.builtin.dpkg_selections:
    name: openbao
    selection: hold
  when: not vault_baseline_openbao_dry_install | bool

- name: Keep OpenBao stopped and disabled until Phase 0.5
  ansible.builtin.systemd_service:
    name: openbao
    enabled: false
    state: stopped
  when:
    - not vault_baseline_openbao_enabled | bool
    - not vault_baseline_openbao_dry_install | bool

# HOMELAB-30. The package creates the data directory; hold its owner and mode.
- name: Keep the Raft data directory private to openbao
  ansible.builtin.file:
    path: "{{ vault_baseline_openbao_data_dir }}"
    state: directory
    owner: openbao
    group: openbao
    mode: '0750'
  when: not vault_baseline_openbao_dry_install | bool

# The config's audit stanza points here, so it must exist before OpenBao loads it.
- name: Create the audit log directory
  ansible.builtin.file:
    path: "{{ vault_baseline_openbao_audit_dir }}"
    state: directory
    owner: openbao
    group: openbao
    mode: '0750'
  when: not vault_baseline_openbao_dry_install | bool

# HOMELAB-47. The gcpckms seal's service-account key. Installed on every node whatever the
# seal, so a migration only has to change the config. no_log keeps it out of output and
# diffs; verify checks owner and mode, never content.
- name: Check for the KMS credential
  ansible.builtin.stat:
    path: "{{ vault_baseline_gcp_kms_credentials_path }}"
    get_checksum: false
  register: vault_baseline_gcp_kms_credentials
  when: not vault_baseline_openbao_dry_install | bool

- name: Install the KMS credential from pass
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.pipe', 'pass show ' ~ vault_baseline_gcp_kms_pass_entry) }}"
    dest: "{{ vault_baseline_gcp_kms_credentials_path }}"
    owner: openbao
    group: openbao
    mode: '0400'
  diff: false
  no_log: true
  when:
    - not vault_baseline_openbao_dry_install | bool
    - not vault_baseline_gcp_kms_credentials.stat.exists or vault_baseline_gcp_kms_rotate | bool

- name: Keep the KMS credential private to openbao
  ansible.builtin.file:
    path: "{{ vault_baseline_gcp_kms_credentials_path }}"
    owner: openbao
    group: openbao
    mode: '0400'
  when:
    - not vault_baseline_openbao_dry_install | bool
    - vault_baseline_gcp_kms_credentials.stat.exists

- name: Install trust and check the listener certificate
  ansible.builtin.import_tasks: tls.yaml
  when: not vault_baseline_openbao_dry_install | bool

# Replaces the package's default file.
- name: Write the node's OpenBao configuration
  ansible.builtin.template:
    src: openbao.hcl.j2
    dest: "{{ vault_baseline_openbao_config_path }}"
    owner: root
    group: openbao
    mode: '0640'
  register: vault_baseline_openbao_config
  when: not vault_baseline_openbao_dry_install | bool

# Starts a stopped service but never restarts a running one unless asked to (below).
- name: Enable and start OpenBao
  ansible.builtin.systemd_service:
    name: openbao
    enabled: true
    state: started
  register: vault_baseline_openbao_service
  when:
    - vault_baseline_openbao_enabled | bool
    - not vault_baseline_openbao_dry_install | bool

# HOMELAB-55. What the running server serves, which can lag the config until a restart.
# curl succeeds on any HTTP status once the TLS handshake verifies against the chain.
- name: Read whether the API answers over TLS
  ansible.builtin.command: >-
    /usr/bin/curl -sS -o /dev/null --max-time 5 --cacert {{ vault_baseline_openbao_ca_file }}
    https://127.0.0.1:{{ vault_baseline_api_port }}/v1/sys/health
  register: vault_baseline_openbao_tls_probe
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - vault_baseline_openbao_enabled | bool
    - not vault_baseline_openbao_dry_install | bool

- name: Note what the running server needs
  ansible.builtin.set_fact:
    vault_baseline_openbao_stale: >-
      {{ vault_baseline_openbao_enabled | bool
         and not vault_baseline_openbao_dry_install | bool
         and vault_baseline_openbao_service is not changed
         and (vault_baseline_openbao_config is changed
              or (vault_baseline_openbao_tls_probe.rc == 0) != (vault_baseline_openbao_tls | bool)) }}
    vault_baseline_openbao_scheme: "{{ 'https' if vault_baseline_openbao_tls_probe.rc | default(1) == 0 else 'http' }}"

# SIGHUP reloads what OpenBao can apply live, including audit devices and log level, and
# does not seal the node. Listener, storage and seal changes still need a restart.
- name: Reload a running node's configuration
  ansible.builtin.systemd_service:
    name: openbao
    state: reloaded
  when:
    - vault_baseline_openbao_stale | bool
    - vault_baseline_openbao_config is changed
    - not vault_baseline_openbao_restart | bool

- name: Warn that some settings need a restart
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: openbao.hcl differs from what OpenBao runs. Audit and
      log-level changes are live after the reload; listener, storage or seal changes need a
      restart: re-run with -e vault_baseline_openbao_restart=true (auto-unseal, standbys first).
  when:
    - vault_baseline_openbao_stale | bool
    - not vault_baseline_openbao_restart | bool

- name: Restart OpenBao onto its configuration
  when:
    - vault_baseline_openbao_stale | bool
    - vault_baseline_openbao_restart | bool
  block:
    # sys/leader is unauthenticated. Restarting the active node forces an election and drops
    # in-flight requests; a step-down hands over cleanly.
    - name: Read whether this node is active
      ansible.builtin.command: >-
        /usr/bin/curl -sS --max-time 5 --cacert {{ vault_baseline_openbao_ca_file }}
        {{ vault_baseline_openbao_scheme }}://127.0.0.1:{{ vault_baseline_api_port }}/v1/sys/leader
      register: vault_baseline_openbao_leader
      changed_when: false
      check_mode: false

    - name: Refuse to restart the active node
      ansible.builtin.assert:
        that:
          - not (vault_baseline_openbao_leader.stdout | from_json).is_self
        fail_msg: >-
          {{ inventory_hostname }} is the active node. Run `pki/openbao-pki.sh step-down`,
          then this play again.

    # Auto-unseal (gcpckms): the node comes back unsealed with no one at the keyboard.
    - name: Restart OpenBao
      ansible.builtin.systemd_service:
        name: openbao
        state: restarted
      register: vault_baseline_openbao_restarted

    - name: Wait for it to unseal and rejoin as a standby
      ansible.builtin.uri:
        url: "{{ scheme }}://127.0.0.1:{{ vault_baseline_api_port }}/v1/sys/leader"
        ca_path: "{{ vault_baseline_openbao_ca_file if scheme == 'https' else omit }}"
      register: vault_baseline_openbao_rejoined
      until: >-
        vault_baseline_openbao_rejoined.json is defined
        and vault_baseline_openbao_rejoined.json.leader_address | default('') | length > 0
        and vault_baseline_openbao_rejoined.json.raft_applied_index | default(0) | int > 0
      retries: 30
      delay: 2
      vars:
        scheme: "{{ 'https' if vault_baseline_openbao_tls | bool else 'http' }}"
      when: not ansible_check_mode

    - name: Require it unsealed
      ansible.builtin.uri:
        url: "{{ scheme }}://127.0.0.1:{{ vault_baseline_api_port }}/v1/sys/seal-status"
        ca_path: "{{ vault_baseline_openbao_ca_file if scheme == 'https' else omit }}"
      register: vault_baseline_openbao_unsealed
      failed_when: vault_baseline_openbao_unsealed.json.sealed
      vars:
        scheme: "{{ 'https' if vault_baseline_openbao_tls | bool else 'http' }}"
      when: not ansible_check_mode

- name: Note whether the node now serves TLS
  ansible.builtin.set_fact:
    vault_baseline_openbao_serving_tls: >-
      {{ vault_baseline_openbao_tls | bool and vault_baseline_openbao_enabled | bool
         and (vault_baseline_openbao_tls_probe.rc | default(1) == 0
              or vault_baseline_openbao_restarted is changed) }}

# Clients beyond management reach the API only over TLS. A restart that failed has already
# stopped the play, so this runs only on a node verified above.
- name: Open the API to the cluster networks once the node serves TLS
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "{{ vault_baseline_api_port | string }}"
    proto: tcp
    comment: openbao-api
    delete: "{{ not vault_baseline_openbao_serving_tls | bool }}"
  loop: "{{ vault_baseline_api_tls_sources }}"

# pam_env reads /etc/environment for SSH sessions, interactive or not, and for sudo, so
# `ssh vault-0X 'bao status'` reaches the local listener with no flags.
- name: Point local bao clients at the TLS listener
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^{{ item.key }}='
    line: '{{ item.key }}={{ item.value }}'
    state: "{{ 'present' if vault_baseline_openbao_serving_tls | bool else 'absent' }}"
  loop: "{{ {'VAULT_ADDR': 'https://127.0.0.1:' ~ vault_baseline_api_port, 'VAULT_CACERT': vault_baseline_openbao_ca_file} | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
