---
# Read-only acceptance checks for HOMELAB-26/27/30/34/47/55. vault-baseline.yaml runs them after each
# node; vault-verify.yaml runs them on demand.
- name: Read node state
  ansible.builtin.command: "{{ item.value }}"
  loop: "{{ commands | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: vault_baseline_state
  changed_when: false
  failed_when: false
  check_mode: false
  vars:
    commands:
      swap: /usr/sbin/swapon --noheadings --show=NAME
      sshd: /usr/sbin/sshd -T
      time: /usr/bin/timedatectl show
      chrony: /usr/bin/chronyc -n tracking
      ufw: /usr/sbin/ufw status verbose
      bao: /usr/bin/bao version
      bao_user: /usr/bin/getent passwd openbao
      bao_group: /usr/bin/getent group openbao
      bao_selection: /usr/bin/dpkg --get-selections openbao
      bao_enabled: /usr/bin/systemctl is-enabled openbao
      bao_active: /usr/bin/systemctl is-active openbao
      listeners: /usr/bin/ss -Htln
      bao_data: /usr/bin/find {{ vault_baseline_openbao_data_dir }} -mindepth 1 -print -quit
      bao_perms: /usr/bin/stat -c '%n %U:%G %a' {{ vault_baseline_openbao_config_path }} {{ vault_baseline_openbao_data_dir }}
      bao_config: /usr/bin/grep -cE '^ +node_id += "{{ inventory_hostname }}"$|^disable_mlock' {{ vault_baseline_openbao_config_path }}
      bao_audit_dir: /usr/bin/stat -c '%U:%G %a' {{ vault_baseline_openbao_audit_dir }}
      logrotate: /usr/sbin/logrotate --debug /etc/logrotate.d/openbao-audit
      bao_kms_credentials: /usr/bin/stat -c '%U:%G %a' {{ vault_baseline_gcp_kms_credentials_path }}
      bao_seal: /usr/bin/grep -c '^seal "gcpckms"' {{ vault_baseline_openbao_config_path }}
      # HOMELAB-55. Public material only: the served leaf, never the file holding the key.
      tls_leaf: >-
        /bin/sh -c '/usr/bin/openssl s_client -connect {{ ansible_host }}:{{ vault_baseline_api_port }}
        -verify_ip {{ ansible_host }} -CAfile {{ vault_baseline_openbao_ca_file }} -verify_return_error -tls1_3
        </dev/null 2>/dev/null | /usr/bin/openssl x509 -noout -subject -ext subjectAltName -enddate -nameopt RFC2253'
      tls12: >-
        /bin/sh -c '/usr/bin/openssl s_client -connect 127.0.0.1:{{ vault_baseline_api_port }} -tls1_2 </dev/null >/dev/null 2>&1'
      tls_file: /usr/bin/stat -c '%U:%G %a' {{ vault_baseline_openbao_tls_file }} {{ vault_baseline_openbao_tls_file | dirname }}
      # The system store alone: localhost must validate with no --cacert.
      trust_store: /usr/bin/curl -sS -o /dev/null --max-time 5 https://localhost:{{ vault_baseline_api_port }}/v1/sys/health
      trust_root: /usr/bin/cat /etc/ssl/certs/{{ vault_baseline_root_ca_name }}.crt
      ca_file: /usr/bin/cat {{ vault_baseline_openbao_ca_file }}
      ca_perms: /usr/bin/stat -c '%U:%G %a' {{ vault_baseline_openbao_ca_file }}
      package_tls: /usr/bin/stat /opt/openbao/tls
      environment: /usr/bin/grep -E '^VAULT_(ADDR|CACERT)=' /etc/environment

- name: Index node state by name
  ansible.builtin.set_fact:
    vault_baseline_state_by_name: "{{ dict(vault_baseline_state.results | map(attribute='item.key') | zip(vault_baseline_state.results)) }}"

- name: Note the clock offset
  ansible.builtin.set_fact:
    # chronyc reports "System time : 0.000012345 seconds fast|slow of NTP time".
    vault_baseline_clock_offset_ms: "{{ (s.stdout | regex_search('System time\\s*:\\s*([0-9.]+) seconds', '\\1') | first | float * 1000) | round(3) }}"
  vars:
    s: "{{ vault_baseline_state_by_name.chrony }}"

- name: Verify swap, SSH and time
  ansible.builtin.assert:
    that:
      - st.swap.rc == 0 and st.swap.stdout | trim == ''
      - st.sshd.stdout is search('(?m)^permitrootlogin no$')
      - st.sshd.stdout is search('(?m)^passwordauthentication no$')
      - st.sshd.stdout is search('(?m)^kbdinteractiveauthentication no$')
      - st.time.stdout is search('(?m)^Timezone=' ~ (vault_baseline_timezone | regex_escape) ~ '$')
      - st.time.stdout is search('(?m)^NTPSynchronized=yes$')
      - st.chrony.stdout is search('(?m)^Leap status\s*:\s*Normal$')
      - vault_baseline_clock_offset_ms | float < vault_baseline_max_clock_offset_ms
    fail_msg: >-
      Swap, SSH or time differs from the baseline on {{ inventory_hostname }}
      (clock offset {{ vault_baseline_clock_offset_ms }} ms).
  vars:
    st: "{{ vault_baseline_state_by_name }}"

# One line per expected rule, as `ufw status verbose` prints it, and nothing else allowed.
- name: Verify the firewall
  ansible.builtin.assert:
    that:
      - "ufw.stdout is search('(?m)^Status: active$')"
      - "ufw.stdout is search('(?m)^Default: deny \\(incoming\\), allow \\(outgoing\\)')"
      - expected | reject('in', ufw.stdout_lines | map('regex_replace', '\s+', ' ') | map('trim') | list) | list == []
      - ufw.stdout_lines | select('search', 'ALLOW IN') | list | length == expected | length
    fail_msg: >-
      Firewall on {{ inventory_hostname }} differs. Missing:
      {{ expected | reject('in', ufw.stdout_lines | map('regex_replace', '\s+', ' ') | map('trim') | list) | list }}.
      Review `sudo ufw status verbose`.
  vars:
    ufw: "{{ vault_baseline_state_by_name.ufw }}"
    expected: >-
      {{ (vault_baseline_ssh_sources | map('regex_replace', '^(.*)$', '22/tcp ALLOW IN \1 # ssh') | list)
       + ((vault_baseline_api_sources + (vault_baseline_api_tls_sources if vault_baseline_openbao_tls | bool else []))
          | map('regex_replace', '^(.*)$', vault_baseline_api_port ~ '/tcp ALLOW IN \1 # openbao-api') | list)
       + (vault_baseline_cluster_peers | map('regex_replace', '^(.*)$', vault_baseline_cluster_port ~ '/tcp ALLOW IN \1 # openbao-raft') | list) }}

- name: Verify the OpenBao package
  ansible.builtin.assert:
    that:
      - st.bao.rc == 0
      - st.bao.stdout is search('^OpenBao v' ~ (vault_baseline_openbao_version | regex_escape) ~ '\s')
      - st.bao_user.rc == 0 and st.bao_group.rc == 0
      - st.bao_selection.stdout is search('^openbao\s+hold$')
    fail_msg: OpenBao on {{ inventory_hostname }} is not the held {{ vault_baseline_openbao_version }} package.
  vars:
    st: "{{ vault_baseline_state_by_name }}"

- name: Verify OpenBao is stopped, disabled and holds no data
  ansible.builtin.assert:
    that:
      - st.bao_enabled.stdout | trim == 'disabled'
      - st.bao_active.stdout | trim == 'inactive'
      - st.listeners.stdout_lines | select('search', ':(' ~ vault_baseline_api_port ~ '|' ~ vault_baseline_cluster_port ~ ')\s') | list == []
      - st.bao_data.stdout | trim == ''
    fail_msg: >-
      OpenBao on {{ inventory_hostname }} is {{ st.bao_enabled.stdout | trim }}/{{ st.bao_active.stdout | trim }},
      listeners {{ st.listeners.stdout_lines | select('search', ':(' ~ vault_baseline_api_port ~ '|' ~ vault_baseline_cluster_port ~ ')\s') | list }}, data [{{ st.bao_data.stdout | trim }}]. Phase 0.4 leaves it off and empty.
  vars:
    st: "{{ vault_baseline_state_by_name }}"
  when: not vault_baseline_openbao_enabled | bool

# HOMELAB-30. The grep must find this node's node_id and no disable_mlock, which OpenBao 2.x flags as unknown.
- name: Verify the OpenBao configuration and data directory
  ansible.builtin.assert:
    that:
      - st.bao_perms.stdout_lines == [vault_baseline_openbao_config_path ~ ' root:openbao 640', vault_baseline_openbao_data_dir ~ ' openbao:openbao 750']
      - st.bao_config.stdout | trim == '1'
    fail_msg: >-
      OpenBao config or data directory on {{ inventory_hostname }} differs: {{ st.bao_perms.stdout_lines }},
      {{ st.bao_config.stdout | trim }} matching lines (expected only node_id). Run vault-baseline.yaml.
  vars:
    st: "{{ vault_baseline_state_by_name }}"

# HOMELAB-34. logrotate --debug parses the file and dry-runs it; it rotates nothing.
- name: Verify the audit log directory and its rotation
  ansible.builtin.assert:
    that:
      - st.bao_audit_dir.stdout | trim == 'openbao:openbao 750'
      - st.logrotate.rc == 0
      - st.logrotate.stderr is not search('(?i)error')
    fail_msg: >-
      Audit directory on {{ inventory_hostname }} is [{{ st.bao_audit_dir.stdout | trim }}] or
      /etc/logrotate.d/openbao-audit fails `logrotate --debug`. Run vault-baseline.yaml.
  vars:
    st: "{{ vault_baseline_state_by_name }}"

# HOMELAB-47. The seal stanza must match the node's intended seal.
- name: Verify the KMS credential and the configured seal
  ansible.builtin.assert:
    that:
      - st.bao_kms_credentials.stdout | trim == 'openbao:openbao 400'
      - (st.bao_seal.stdout | trim == '1') == (vault_baseline_openbao_seal == 'gcpckms')
    fail_msg: >-
      On {{ inventory_hostname }}: KMS credential [{{ st.bao_kms_credentials.stdout | trim }}{{ st.bao_kms_credentials.stderr | trim }}],
      gcpckms stanzas {{ st.bao_seal.stdout | trim }}, intended seal {{ vault_baseline_openbao_seal }}. Run vault-baseline.yaml.
  vars:
    st: "{{ vault_baseline_state_by_name }}"

# A sealed node serves the API; it listens on the cluster port only once unsealed.
- name: Verify OpenBao is enabled, running and serving the API
  ansible.builtin.assert:
    that:
      - st.bao_enabled.stdout | trim == 'enabled'
      - st.bao_active.stdout | trim == 'active'
      - st.listeners.stdout_lines | select('search', ':' ~ vault_baseline_api_port ~ '\s') | list != []
    fail_msg: >-
      OpenBao on {{ inventory_hostname }} is {{ st.bao_enabled.stdout | trim }}/{{ st.bao_active.stdout | trim }}
      with API listeners {{ st.listeners.stdout_lines | select('search', ':' ~ vault_baseline_api_port ~ '\s') | list }}.
      Check `journalctl -u openbao`.
  vars:
    st: "{{ vault_baseline_state_by_name }}"
  when: vault_baseline_openbao_enabled | bool

# HOMELAB-55. The handshake verifies against the chain and the node's IP SAN; TLS 1.2 must
# fail; the leaf names this node; the system store alone validates localhost.
- name: Note the listener certificate's remaining days
  ansible.builtin.set_fact:
    vault_baseline_listener_days: >-
      {{ ((st.tls_leaf.stdout | regex_search('(?<=notAfter=).*') | regex_replace(' +', ' ')
           | to_datetime('%b %d %H:%M:%S %Y GMT')) - now(utc=true)).days }}
  vars:
    st: "{{ vault_baseline_state_by_name }}"
  when:
    - vault_baseline_openbao_tls | bool
    - vault_baseline_state_by_name.tls_leaf.rc == 0

- name: Verify the TLS listener, trust and local client settings
  ansible.builtin.assert:
    that:
      - st.tls_leaf.rc == 0
      - st.tls_leaf.stdout is search('(?m)^subject=CN=' ~ (inventory_hostname ~ '.homelab.internal') | regex_escape ~ '$')
      - st.tls_leaf.stdout is search('DNS:vault\.homelab\.internal')
      - st.tls_leaf.stdout is search('DNS:localhost')
      - st.tls_leaf.stdout is search('IP Address:127\.0\.0\.1')
      - st.tls_leaf.stdout is search('(?m)IP Address:' ~ (ansible_host | regex_escape) ~ '(,|$)')
      - vault_baseline_listener_days | int >= vault_baseline_listener_min_days
      - st.tls12.rc != 0
      - st.tls_file.stdout_lines == ['openbao:openbao 400', 'openbao:openbao 700']
      - st.trust_store.rc == 0
      - st.trust_root.stdout | trim == lookup('ansible.builtin.file', vault_baseline_root_ca_src) | trim
      - st.ca_file.stdout | trim == (lookup('ansible.builtin.file', vault_baseline_intermediate_ca_src) ~ '\n' ~ lookup('ansible.builtin.file', vault_baseline_root_ca_src)) | trim
      - st.ca_perms.stdout | trim == 'root:root 444'
      - st.package_tls.rc != 0
      - st.environment.stdout_lines | sort == ['VAULT_ADDR=https://127.0.0.1:' ~ vault_baseline_api_port, 'VAULT_CACERT=' ~ vault_baseline_openbao_ca_file]
    fail_msg: >-
      TLS on {{ inventory_hostname }} differs. Served leaf (rc {{ st.tls_leaf.rc }}): {{ st.tls_leaf.stdout_lines }};
      {{ vault_baseline_listener_days | default('?') }} days left (minimum {{ vault_baseline_listener_min_days }});
      TLS 1.2 rc {{ st.tls12.rc }} (must fail); files {{ st.tls_file.stdout_lines }}; system trust rc {{ st.trust_store.rc }};
      ca.pem {{ st.ca_perms.stdout | trim }}; /opt/openbao/tls present {{ st.package_tls.rc == 0 }};
      /etc/environment {{ st.environment.stdout_lines }}. Run vault-baseline.yaml, or pki/openbao-pki.sh listener to renew.
  vars:
    st: "{{ vault_baseline_state_by_name }}"
  when: vault_baseline_openbao_tls | bool

- name: Note this node's results for the cross-node comparison
  ansible.builtin.set_fact:
    vault_baseline_summary:
      node: "{{ inventory_hostname }}"
      host: "{{ vault_vm_pve_node | default('') }}"
      vmid: "{{ vault_vm_vmid | default('') }}"
      address: "{{ ansible_host }}"
      bao: "{{ st.bao.stdout | regex_search('v[0-9][^ ]*') }}"
      held: "{{ st.bao_selection.stdout is search('hold') }}"
      service: "{{ st.bao_enabled.stdout | trim }}/{{ st.bao_active.stdout | trim }}"
      clock_offset_ms: "{{ vault_baseline_clock_offset_ms }}"
      firewall_rules: "{{ st.ufw.stdout_lines | select('search', 'ALLOW IN') | list | length }}"
      tls: "{{ vault_baseline_openbao_tls | bool }}"
      listener_days: "{{ vault_baseline_listener_days | default('') }}"
      listener_cert: "{{ st.tls_leaf.stdout_lines | default([]) | select('search', '^(subject|notAfter)=') | list }}"
  vars:
    st: "{{ vault_baseline_state_by_name }}"
