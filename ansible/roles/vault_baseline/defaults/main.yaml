---
vault_baseline_timezone: America/Denver
# Largest chrony offset verify accepts after the clock settles (HOMELAB-26).
vault_baseline_max_clock_offset_ms: 300

# Phase 0.4b access matrix. SSH: management VLAN 40 and the workstation VLAN 10.
vault_baseline_ssh_sources:
  - 192.168.40.0/24
  - 192.168.10.0/24
# API: management and the workstation always. homelab-prod and homelab-dev only once the
# node serves TLS (HOMELAB-31/55): the role opens them after this node's listener answers
# over TLS and closes them while it is plain HTTP.
vault_baseline_api_port: 8200
vault_baseline_api_sources:
  - 192.168.40.0/24
  - 192.168.10.0/24
vault_baseline_api_tls_sources:
  - 192.168.50.0/24
  - 192.168.60.0/24
# Raft: only the three nodes, one rule each.
vault_baseline_cluster_port: 8201
vault_baseline_cluster_peers: "{{ groups['vault'] | map('extract', hostvars, 'ansible_host') | sort }}"

vault_baseline_openbao_url: https://github.com/openbao/openbao/releases/download/v{{ vault_baseline_openbao_version }}/openbao_{{ vault_baseline_openbao_version }}_linux_amd64.deb
vault_baseline_openbao_package_path: /var/cache/homelab/openbao_{{ vault_baseline_openbao_version }}_linux_amd64.deb
vault_baseline_openbao_config_path: /etc/openbao/openbao.hcl
vault_baseline_openbao_data_dir: /opt/openbao/data
# Phase 0.4 installed OpenBao stopped and disabled. Phase 0.5 writes the config with this
# still false, then sets it true to start the service; until then a run stops a service
# someone started by hand.
vault_baseline_openbao_enabled: false
# HOMELAB-34. Each node writes its own copy of the cluster-wide file audit device.
vault_baseline_openbao_audit_dir: /opt/openbao/audit
vault_baseline_openbao_audit_rotate: 14
# HOMELAB-47/48. Seal: shamir until Phase 0.6e migrates a node, then gcpckms. Set per host
# during the migration (-e or host_vars), then for the group. A seal change takes effect
# only on restart, which this role never does.
vault_baseline_openbao_seal: shamir
# GCP KMS for the gcpckms seal (gcp/vault-kms.sh owns these resources).
vault_baseline_gcp_kms_project: daltonbuilds-homelab-vault
vault_baseline_gcp_kms_region: us-central1
vault_baseline_gcp_kms_key_ring: vault-unseal
vault_baseline_gcp_kms_crypto_key: vault-unseal-key
vault_baseline_gcp_kms_credentials_path: /etc/openbao/gcp-kms.json
# The SA key lives in pass on the workstation and is read only when a node lacks the file
# or when rotating (-e vault_baseline_gcp_kms_rotate=true), so routine runs never touch pass.
vault_baseline_gcp_kms_pass_entry: homelab/vault/gcp-kms-sa
vault_baseline_gcp_kms_rotate: false
# Loopback ports for the throwaway diagnose config in tasks/kms_preflight.yaml.
vault_baseline_preflight_api_port: 18200
vault_baseline_preflight_cluster_port: 18201
vault_baseline_preflight_unit: openbao-preflight

# HOMELAB-55 (Phase 0.7d). The listener serves TLS from one file holding the leaf, its chain
# and its key, which pki/openbao-pki.sh listener issues on the node. Off until that file is
# on every node; the role refuses to turn it on without the file.
vault_baseline_openbao_tls: false
vault_baseline_openbao_tls_file: /etc/openbao/tls/listener.pem
# The CA chain (intermediate + root) clients on the node and retry_join verify against.
vault_baseline_openbao_ca_file: /etc/openbao/ca.pem
# The root in the system trust store. update-ca-certificates links it as
# /etc/ssl/certs/homelab-root-ca.pem (not .crt), the path later tiers use.
vault_baseline_root_ca_name: homelab-root-ca
# Public certificates committed in homelab-infra pki/.
vault_baseline_pki_dir: "{{ playbook_dir }}/../../pki"
vault_baseline_root_ca_src: "{{ vault_baseline_pki_dir }}/homelab-root-ca.crt"
vault_baseline_intermediate_ca_src: "{{ vault_baseline_pki_dir }}/homelab-intermediate-2026.crt"
# A normal run never restarts OpenBao. With this true, a node whose listener, storage or seal
# config differs from what it runs restarts once, auto-unseals and must come back serving
# before the play moves on. It refuses the active node: step it down first.
vault_baseline_openbao_restart: false
# verify fails when the listener certificate has fewer days left (renewal is 0.7e).
vault_baseline_listener_min_days: 7
