---
ts_router_hostname: "{{ inventory_hostname }}"
ts_router_debian_suite: trixie
ts_router_apt_key_url: "https://pkgs.tailscale.com/stable/debian/{{ ts_router_debian_suite }}.noarmor.gpg"
ts_router_apt_key_path: /usr/share/keyrings/tailscale-archive-keyring.gpg
ts_router_apt_uri: https://pkgs.tailscale.com/stable/debian

# Supplied at enrollment only: a pre-approved, tagged, single-use key with a short expiry.
# Read from the workstation environment so it never reaches inventory or Git.
ts_router_auth_key: "{{ lookup('ansible.builtin.env', 'TS_AUTHKEY') }}"
