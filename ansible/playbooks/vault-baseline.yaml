---
# HOMELAB-26/27/30/34: harden the OpenBao VMs, install the pinned OpenBao package, write
# its config and prepare audit logging. The service starts only once
# vault_baseline_openbao_enabled is true.
# Run vault-vm.yaml first. One node at a time: --limit vault-03 first.
- name: Harden the OpenBao VMs and install OpenBao, one node at a time
  hosts: vault
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  become: true
  tasks:
    - name: Apply the baseline
      ansible.builtin.import_role:
        name: vault_baseline
        tasks_from: converge

    - name: Reload ssh before verifying it
      ansible.builtin.meta: flush_handlers

    # Check mode predicts changes it did not make, so post-change assertions would fail.
    - name: Verify the node before moving to the next one
      ansible.builtin.include_role:
        name: vault_baseline
        tasks_from: verify
      when: not ansible_check_mode
