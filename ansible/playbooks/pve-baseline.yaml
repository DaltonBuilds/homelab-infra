---
- name: Converge the Proxmox host baseline one host at a time
  hosts: pve
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Apply the baseline
      ansible.builtin.import_role:
        name: pve_baseline
        tasks_from: converge

    # Check mode predicts changes it did not make, so post-change assertions would fail.
    - name: Verify the host before moving to the next one
      ansible.builtin.include_role:
        name: pve_baseline
        tasks_from: verify
      when: not ansible_check_mode
