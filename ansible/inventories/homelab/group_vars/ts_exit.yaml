---
# HOMELAB-41: exit node for working from public Wi-Fi. Same role as the subnet router,
# advertising the exit route instead of PVE routes. pve-03 has spare capacity and is
# already the remote-access host; losing it drops the exit node too.
ansible_python_interpreter: /usr/bin/python3

# The tailnet policy does not reach this container, so remote runs jump through pve-03.
# On the LAN the jump still works, so there is one path everywhere.
ansible_ssh_common_args: -o ProxyJump=root@192.168.40.58

ts_router_pve_node: pve-03
# 100/102 are bgp-01/bgp-02 and 110 is ts-router-01 (checked 2026-10-27). Keep this ID unique cluster-wide.
ts_router_vmid: 111
ts_router_description: Tailscale exit node for remote work on public networks. Managed by homelab-infra ts-exit-node.yaml (HOMELAB-41).
ts_router_template: debian-13-standard_13.6-1_amd64.tar.zst
ts_router_rootfs_storage: local-lvm
ts_router_disk_gb: 4
ts_router_cores: 1
ts_router_memory_mb: 256
ts_router_swap_mb: 256

# .14 did not answer ping from pve-03 on 2026-10-27. Like .13, it must be outside the
# UniFi VLAN 40 DHCP range.
ts_router_address_prefix: 24
ts_router_gateway: 192.168.40.1
ts_router_dns_servers:
  - 192.168.40.1
ts_router_domain: homelab.internal

# Public key only. Installed for root in the container at creation.
ts_router_admin_ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICJhM8FK0OMcpiXpTPgry8BkoxlNSx6VrVuQKIyJYyVA homelab-admin"

ts_router_tag: tag:exit-node
# Internet egress only. The policy grants autogroup:internet, which excludes the LAN.
ts_router_routes: []
ts_router_exit_node: true
