[tools]
# paramiko is the SSH library for network_cli, which the vyos.vyos modules use.
# netcommon deprecates it after 2028-02 for ansible-pylibssh, which has no arm64
# macOS wheel for this Python yet.
ansible-core = { version = "2.21.4", uvx_args = "--with paramiko==5.1.0" }
# Same release as the cluster (group_vars/vault.yaml); 2.6.x until ADR-006 clears 2.7.
openbao = "2.6.5"
# Keep yamllint on the same release as .pre-commit-config.yaml.
pre-commit = "4.6.2"
yamllint = "1.38.0"

[env]
ANSIBLE_CONFIG = "{{config_root}}/ansible/ansible.cfg"

[tasks.lint]
description = "Require a YAML document start marker"
run = "yamllint ."
